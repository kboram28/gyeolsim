<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>포토카드 검수</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1c1c1e;--sub:#6b6b70;--ok:#23a052;--no:#e03b3b;--line:#e3e3e8;--acc:#8e4fe0}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:18px;margin:0 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.bar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.bar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat{margin-left:auto;color:var(--sub)}.saved{color:var(--ok)}
.help{font-size:12px;color:var(--sub);margin-top:6px}
main{padding:12px 16px 80px;max-width:1200px;margin:0 auto}
.vid{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.vt{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.vt a{color:var(--sub);font-weight:400;font-size:12px}
.tag{font-size:11px;padding:2px 6px;border-radius:6px;background:#eee;color:var(--sub);font-weight:500}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cand{position:relative;border-radius:10px;overflow:hidden;border:3px solid transparent;cursor:pointer;background:#ddd}
.cand img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#222;display:block}
.cand.in{border-color:var(--ok)}
.cand .lab{position:absolute;left:6px;top:6px;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;color:#fff;background:#0009}
.cand.in .lab{background:var(--ok)}
.cand.ch{outline:3px dashed var(--acc);outline-offset:2px}
.why{font-size:11px;color:var(--sub);padding:5px 6px;background:#fff;min-height:26px}
.cand.in .why{color:var(--ok)}
.na{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px}
dialog{border:none;border-radius:16px;padding:16px;max-width:360px;width:90%}
dialog h3{margin:0 0 10px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:13px;cursor:pointer}
.chips button.on{background:var(--no);color:#fff;border-color:var(--no)}
dialog input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.acts button{padding:8px 14px;border-radius:8px;border:none;font-size:14px;cursor:pointer}
.pri{background:var(--ink);color:#fff}
@media (max-width:640px){.row{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header>
 <h1>포토카드 검수</h1>
 <div class="bar">
  <button data-f="all" class="on">전체</button><button data-f="in">자동 선택됨</button><button data-f="out">선택 없는 영상</button><button data-f="mine">내가 수정함</button>
  <span class="stat" id="stat"></span>
 </div>
 <div class="help">초록 테두리 = 포토카드로 넣음. 사진을 누르면 넣기/빼기가 바뀌어요. 뺄 때는 이유를 골라 주세요. 한 영상에서 여러 장 넣어도 돼요. 보라 점선 = 내가 바꾼 것.</div>
</header>
<main id="list"></main>
<dialog id="dlg"><h3>왜 빼나요?</h3>
 <div class="chips" id="chips"></div>
 <input id="note" placeholder="이유를 직접 적어도 돼요 (선택)">
 <div class="acts"><button id="cancel">취소</button><button class="pri" id="okb">빼기</button></div>
</dialog>
<dialog id="dlg2"><h3>넣는 이유 (선택)</h3>
 <div class="help" id="autowhy" style="margin-bottom:8px"></div>
 <input id="note2" placeholder="예: 얼굴 안 잘렸어요, 예쁘게 나왔어요">
 <div class="acts"><button id="cancel2">취소</button><button class="pri" id="okb2">넣기</button></div>
</dialog>
<script>
const REASONS=['김결 아님','얼굴 잘림','눈 감음','표정 별로','흐림/화질','얼굴 작음','글씨·스티커 많음','중복','기타'];
const LBL={thumb:'대표 썸네일',frame1:'장면 1',frame2:'장면 2',frame3:'장면 3'};
let DATA=[],REV={},filter='all',pending=null;
const key=(v,c)=>v.id+'|'+c.src;
const state=(v,c)=>{const r=REV[key(v,c)];return r?r.s:c.s};
async function init(){DATA=await (await fetch('review-data.json')).json();try{REV=await (await fetch('review.json',{cache:'no-store'})).json()}catch(e){REV={}}render()}
function render(){
 const L=document.getElementById('list');let html='';let n=0;
 for(const v of DATA){
  const anyIn=v.c.some(c=>state(v,c));const mine=v.c.some(c=>REV[key(v,c)]);
  if(filter==='in'&&!anyIn)continue;if(filter==='out'&&anyIn)continue;if(filter==='mine'&&!mine)continue;n++;
  html+=`<div class="vid" data-id="${v.id}"><div class="vt"><span class="tag">${v.k==='B'?'숏츠':'영상'}</span>${esc(v.t)} <a href="https://youtu.be/${v.id}" target="_blank">영상 보기</a></div><div class="row">`;
  for(const c of v.c){const s=state(v,c),r=REV[key(v,c)];
   html+=`<div class="cand ${s?'in':''} ${r?'ch':''}" data-src="${c.src}">${c.b?`<img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/${c.q}.jpg">`:'<div class="na">사진 없음</div>'}<span class="lab">${LBL[c.src]}${s?' ✓':''}</span><div class="why">${r?(r.s?'넣음'+(r.note?' · '+esc(r.note):''):'뺌 · '+esc([r.why,r.note].filter(Boolean).join(' · '))):(s?'자동 선택':'자동 제외: '+esc(c.why))}</div></div>`}
  html+='</div></div>'}
 L.innerHTML=html||'<p>해당하는 영상이 없어요.</p>';
 const cards=DATA.reduce((a,v)=>a+v.c.filter(c=>state(v,c)).length,0);
 document.getElementById('stat').innerHTML=`카드 ${cards}장 · 내가 수정 ${Object.keys(REV).length}개 · 보이는 영상 ${n}개 <span class="saved" id="sv"></span>`}
const esc=s=>(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
document.querySelector('.bar').onclick=e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;document.querySelectorAll('.bar button').forEach(x=>x.classList.toggle('on',x===b));render()};
document.getElementById('list').onclick=e=>{const el=e.target.closest('.cand');if(!el||e.target.closest('a'))return;
 const v=DATA.find(x=>x.id===el.closest('.vid').dataset.id),c=v.c.find(x=>x.src===el.dataset.src);if(!c.b)return;pending={v,c};
 if(state(v,c)){document.querySelectorAll('#chips button').forEach(b=>b.classList.remove('on'));document.getElementById('note').value='';document.getElementById('dlg').showModal()}
 else{document.getElementById('autowhy').textContent='자동 제외 이유: '+(c.why||'-');document.getElementById('note2').value='';document.getElementById('dlg2').showModal()}};
document.getElementById('chips').innerHTML=REASONS.map(r=>`<button>${r}</button>`).join('');
document.getElementById('chips').onclick=e=>{const b=e.target.closest('button');if(b)b.classList.toggle('on')};
function setRev(s,why,note){const {v,c}=pending,k=key(v,c);if(s===c.s&&!why&&!note)delete REV[k];else REV[k]={s,auto:c.s,autoWhy:c.why||null,why,note};save();render()}
document.getElementById('okb').onclick=()=>{const why=[...document.querySelectorAll('#chips button.on')].map(b=>b.textContent).join(', ');setRev(0,why,document.getElementById('note').value.trim());document.getElementById('dlg').close()};
document.getElementById('okb2').onclick=()=>{setRev(1,'',document.getElementById('note2').value.trim());document.getElementById('dlg2').close()};
document.getElementById('cancel').onclick=()=>document.getElementById('dlg').close();
document.getElementById('cancel2').onclick=()=>document.getElementById('dlg2').close();
async function save(){try{const r=await fetch('save',{method:'POST',body:JSON.stringify(REV)});document.getElementById('sv').textContent=r.ok?'· 저장됨':'· 저장 실패'}catch(e){document.getElementById('sv').textContent='· 저장 실패 (검수 서버가 꺼져 있어요)'}}
init();
</script></body></html>
