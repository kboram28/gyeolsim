<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="gyeolsim">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>gyeolsim</title>
<style>
:root{
  --bg:#f6f4fb;--card:#ffffff;--ink:#1d1b26;--sub:#6b6880;--line:#e7e3f2;
  --pri:#7c5cff;--pri-ink:#ffffff;--pri-soft:#efeaff;
  --fan:#e09a00;--fan-soft:#fff3d1;--me:#3d7ef5;--me-soft:#e6efff;
  --warn:#e5484d;--warn-soft:#ffe9ea;--ok:#2fa36b;
  --shadow:0 1px 2px rgba(30,15,80,.05),0 6px 20px rgba(30,15,80,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121118;--card:#1c1a25;--ink:#f1effa;--sub:#a29fb5;--line:#2d2a3a;
  --pri:#9b82ff;--pri-ink:#14111f;--pri-soft:#2a2342;
  --fan:#ffc53d;--fan-soft:#3a2f12;--me:#6aa6ff;--me-soft:#1d2a44;
  --warn:#ff6b70;--warn-soft:#3b1d20;--ok:#4cc38a;--shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
select{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-height:44px}
input[type=text],input[type=url],input[type=date],input[type=time]{font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);-webkit-appearance:none;appearance:none;min-height:44px}
input:focus{outline:2px solid var(--pri);outline-offset:-1px}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 100px)}
h1{font-size:24px;margin:0;letter-spacing:-.02em}
h2{font-size:16px;margin:0 0 10px;letter-spacing:-.01em}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 2px 14px}
.top .sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.muted{color:var(--sub);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:12px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--pri);color:var(--pri-ink)}
.btn.ghost{background:var(--pri-soft);color:var(--pri)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.link{color:var(--pri);font-weight:600;text-decoration:underline}

/* hero */
.hero{padding:0;overflow:hidden}
.hero-photo{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.coach{display:flex;gap:12px;align-items:flex-start;padding:16px}
.coach-face{flex:none;width:48px;height:48px;border-radius:50%;background:var(--pri-soft);display:grid;place-items:center;font-size:26px}
.bubble{flex:1;text-align:left;background:var(--pri-soft);border-radius:4px 16px 16px 16px;padding:10px 12px}
.coach-name{font-size:12px;font-weight:700;color:var(--pri);margin-bottom:2px}
.bubble p{margin:0;font-size:15.5px;font-weight:500}
.bubble p.swap{animation:fade .4s}
.bubble .hint{display:block;font-size:11px;color:var(--sub);margin-top:6px}

/* stats */
.stats{display:flex;gap:16px;align-items:center}
.ring{--p:0;flex:none;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:58px;height:58px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:17px}
.stat-txt{flex:1}
.stat-big{font-weight:700;margin-bottom:6px}
.mini{display:flex;gap:14px;font-size:13px;color:var(--sub)}
.mini b{color:var(--ink)}

/* reward */
.reward{display:flex;gap:12px;align-items:center}
.reward.locked{background:var(--card);color:var(--sub)}
.reward.open{background:linear-gradient(135deg,var(--pri-soft),var(--fan-soft))}
.rw-ic{font-size:28px;flex:none}
.rw-body{flex:1;min-width:0}
.rw-label{font-size:12px;font-weight:700;color:var(--pri)}
.rw-title{font-weight:700;font-size:16px;margin:2px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw-btns{display:flex;gap:8px}

.rw-lock{margin:-6px 16px 14px 76px;font-size:12.5px;color:var(--sub)}
.rw-lock b{color:var(--ink)}
.atimes{display:flex;flex-wrap:wrap;gap:6px}
.atime{display:inline-flex;align-items:center;gap:2px;padding:4px 4px 4px 10px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font-size:13px;font-weight:600}
.atime button{width:24px;height:24px;border-radius:50%;font-size:11px;color:var(--pri)}
.alarm-add{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px}
.alarm-add .btn{min-height:44px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(env(safe-area-inset-bottom) + 78px);width:56px;height:56px;border-radius:50%;background:var(--pri);color:var(--pri-ink);font-size:30px;font-weight:400;line-height:1;display:grid;place-items:center;box-shadow:0 6px 18px rgba(60,30,160,.35);z-index:25}

/* dday */
.dd-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.dd-wrap .card{margin-bottom:0}
.dday{min-width:0;padding:14px;border-left:5px solid var(--fan)}
.dd-label{font-size:12px;font-weight:700;color:var(--fan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-num{font-weight:800;font-size:24px;color:var(--fan);white-space:nowrap;margin-top:2px;letter-spacing:-.02em}
.dd-title{font-weight:700;font-size:15px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}

/* lists */
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sec-head h2{margin:0}
ul.list{list-style:none;margin:0;padding:0}
.task,.ev{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child,.ev:last-child{border-bottom:0}
.chk{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--pri-ink);font-size:15px}
.task.done .chk{background:var(--pri);border-color:var(--pri)}
.t-main{flex:1;min-width:0}
.t-title{word-break:break-word}
.task.done .t-title{text-decoration:line-through;color:var(--sub)}
.t-meta{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap}
.star{color:var(--fan);margin-right:3px}
.badge{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--sub)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.hot{background:var(--pri-soft);color:var(--pri)}
.badge.fan{background:var(--fan-soft);color:var(--fan)}
.badge.me{background:var(--me-soft);color:var(--me)}
.x{flex:none;width:34px;height:34px;border-radius:10px;color:var(--sub);font-size:14px}
.ev-time{flex:none;width:46px;font-size:13px;font-weight:700;color:var(--sub)}
.ev-bar{flex:none;width:4px;align-self:stretch;border-radius:4px;background:var(--c,var(--me))}
.empty-txt{color:var(--sub);font-size:14px;padding:6px 0}

/* forms */
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input[type=text]{flex:1}
.add-row .btn{flex:none}
.add-opts{display:flex;gap:8px;margin-top:8px;align-items:center}
.dpf{min-width:0}
.sheet div.f{margin-bottom:12px}
.sheet div.f .dpf,.sheet div.f .tp{margin-top:5px}
.tp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dp-ttl{font-weight:700;font-size:15px;padding:6px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.dp-ttl.on{border-color:var(--pri);color:var(--pri)}
.dp-pick4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dp-opt{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.dp-opt.now{border-color:var(--pri);color:var(--pri)}
.dp-opt.sel{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.dp-opt:disabled{opacity:.3;cursor:default}
.date-btn{display:block;width:100%;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left;font-size:15px}
.dp{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.dp .cal-head{margin-bottom:4px}
.dp .cell{aspect-ratio:auto;height:38px;padding-top:0;justify-content:center}
.dp .cell:disabled{opacity:.3;cursor:default}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--sub)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sort-row{display:flex;gap:6px;align-items:center;margin:0 0 10px;font-size:13px;color:var(--sub)}
.chip.sm{padding:4px 11px;font-size:12.5px}
.pri-pick{display:flex;gap:6px}
.pri-pick label{position:relative}
.pri-pick input{position:absolute;opacity:0;pointer-events:none}
.pri-pick span{display:flex;align-items:center;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);font-weight:600;color:var(--sub);background:var(--bg)}
.pri-pick input:checked+span{background:var(--fan-soft);border-color:var(--fan);color:var(--fan)}
.pri-pick input[value=normal]:checked+span{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.pri-pick input[value=low]:checked+span{background:var(--line);border-color:var(--sub);color:var(--ink)}
.pri-pick input:focus-visible+span{outline:2px solid var(--pri);outline-offset:2px}
.chip .cnt{margin-left:4px;opacity:.7}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h2{margin:0;font-size:18px}
.cal-nav{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:16px;display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wd{text-align:center;font-size:12px;color:var(--sub);padding:4px 0 6px;font-weight:600}
.wd.sun,.cell.sun .num{color:var(--warn)}
.wd.sat,.cell.sat .num{color:var(--me)}
.cell{aspect-ratio:1/1.05;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:3px}
.cell .num{font-size:14px;font-weight:600;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cell.today .num{background:var(--pri);color:var(--pri-ink)!important}
.cell.sel{background:var(--pri-soft)}
.mcell{aspect-ratio:auto;min-height:76px;align-items:stretch;padding:4px 1px;gap:2px;min-width:0;overflow:hidden}
.mcell .num{align-self:center;flex:none;width:24px;height:24px;font-size:13px}
.ce{display:block;font-style:normal;font-size:10px;line-height:15px;padding:0 3px;border-radius:4px;text-align:left;white-space:nowrap;overflow:hidden;background:color-mix(in srgb,var(--c) 20%,transparent);border-left:2px solid var(--c);color:var(--ink)}
.ce.more{background:none;border:0;color:var(--sub);text-align:center}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%}
.dot.cat{background:var(--c)}
.dot.lg{width:14px;height:14px;flex:none}

/* settings */
.field{margin-bottom:14px}
.field>label,.field>.lbl{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg-btn{padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:center}
.seg-btn .f{font-size:22px;display:block}
.seg-btn .n{font-size:13px;font-weight:700}
.seg-btn .d{font-size:11px;color:var(--sub);display:block}
.seg-btn.on{border-color:var(--pri);background:var(--pri-soft)}
.photo-prev{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;display:block;margin-bottom:8px}
.song{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.song-t{flex:1;min-width:0}
.song-t div{font-weight:600}
.song-t small{display:block;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-form{display:grid;gap:8px;margin-top:10px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* install banner */
.install{background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;display:flex;gap:10px;align-items:center}
.install b{color:var(--bg)}
.install button{color:var(--bg);opacity:.7;font-size:18px;flex:none;width:30px;height:30px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:space-around;z-index:20}
nav button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--sub);font-size:11px;font-weight:600}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--pri)}

/* sheet & toast */
.sheet-bg{position:fixed;inset:0;background:rgba(10,5,30,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);animation:up .2s ease-out;max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:18px}
.sheet label.f{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:12px}
.sheet label.f input{margin-top:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.type-seg label{position:relative}
.type-seg input{position:absolute;opacity:0}
.type-seg span{display:block;text-align:center;padding:11px 6px;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:14px}
.type-seg .dot{display:inline-block;margin-right:5px;vertical-align:1px}
.type-seg input:checked+span{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:16px}
.check input{width:20px;height:20px;accent-color:var(--pri)}
.sheet-btns{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100vw - 32px);text-align:center;animation:pop .2s ease-out;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.burst{position:fixed;bottom:-30px;font-size:26px;z-index:45;pointer-events:none;animation:rise 1.6s ease-out forwards}
@keyframes rise{to{transform:translate(var(--dx),-75vh) rotate(25deg);opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}}
/* projects */
textarea{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);resize:vertical;min-height:70px}
.pj-card{display:block;width:100%;text-align:left;position:relative;padding-left:20px;overflow:hidden}
.pj-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--pri))}
.pj-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pj-title{font-weight:700;font-size:16px;word-break:break-word}
.pj-d{font-weight:800;color:var(--sub);white-space:nowrap;font-size:14px}
.pbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px;position:relative}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--pri));transition:width .3s}
.pbar.thin{height:6px;margin:6px 0 4px}
.pbar.time i{background:var(--sub);opacity:.45}
.pj-row{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);gap:8px}
.pj-row b{color:var(--ink)}
.st{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st.ok{background:var(--me-soft);color:var(--me)}
.st.behind,.st.late{background:var(--warn-soft);color:var(--warn)}
.st.done{background:var(--pri-soft);color:var(--pri)}
.st.empty{background:var(--line);color:var(--sub)}
.badge.pj{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.dot.pj{background:var(--pri);border-radius:2px;transform:rotate(45deg)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--pri);font-weight:600;margin:2px 0 8px;min-height:36px}
.pj-big{display:flex;align-items:baseline;gap:8px}
.pj-big b{font-size:40px;letter-spacing:-.03em;color:var(--c,var(--pri))}
.mp{display:block;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--line)}
.mp:last-child{border-bottom:0}
.mp-title{color:var(--ink);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memo{white-space:pre-wrap;word-break:break-word;margin:0}
.color-pick{display:flex;gap:10px;margin:4px 0 14px}
.color-pick label{position:relative}
.color-pick input{position:absolute;opacity:0}
.color-pick span{display:block;width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.color-pick input:checked+span{border-color:var(--card);box-shadow:0 0 0 2px var(--c)}
.t-title[data-act]{cursor:text}

/* 김결: 배경 사진 */
.banner{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:20px;margin-bottom:12px;background:var(--line)}
.banner .pc,.banner>img{position:absolute}
.banner>img{inset:0;width:100%;height:100%;object-fit:cover}
.banner .ov{position:absolute;inset:auto 0 0 0;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff}
.banner .ov h1{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.banner .ov .sub{font-size:13px;opacity:.9}
.hero .banner{border-radius:0;margin:0}
/* 포토카드 (원본에서 띠만 잘라낸 영역을 그대로 보여 줌) */
.pc{position:relative;overflow:hidden;width:100%}
.pc img{position:absolute;max-width:none;height:auto;display:block}
.pcard{display:block;width:100%;border-radius:12px;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.18);background:#fff;position:relative}
.pcard.R{border-color:#8fb8ff}.pcard.SR{border-color:#ffd24a;box-shadow:0 0 0 1px #e0a100,0 4px 14px rgba(224,161,0,.45)}
.pcard.sp{border-color:#ffb3d1;box-shadow:0 0 0 1px #e04fae,0 4px 14px rgba(224,79,174,.45)}
.pcard .rib{position:absolute;left:6px;top:6px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;z-index:1}
.binder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:start}
.binder .land{grid-column:span 2}
.rar-row{display:flex;gap:10px;font-size:13px;color:var(--sub);margin:-4px 0 10px}
.rar-row b{color:var(--ink)}
/* 오늘의 김결 보상 */
.rw-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.rw-head h2{margin:0}
.rw-head span{font-size:12.5px;color:var(--sub);text-align:right}
.rw-ann{background:var(--fan-soft);color:var(--fan);font-weight:700;font-size:13px;padding:8px 10px;border-radius:12px;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;border-radius:14px;background:var(--bg);border:1px solid var(--line);padding:10px;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.tile .ti{font-size:22px}.tile .tt{font-weight:700;font-size:14px}.tile .td{font-size:12px;color:var(--sub)}
.tile.lock{opacity:.85}
.tile.lock::after{content:"🔒";position:absolute;right:8px;top:8px;font-size:14px}
.tile .blur{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(10px) brightness(.85);opacity:.55}
.tile>*{position:relative}
.tile.go{background:var(--pri-soft);border-color:var(--pri)}
.tile.go .tt{color:var(--pri)}
.vrow{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.vth{flex:none;width:150px;text-align:left}
.vth img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;display:block;background:var(--line)}
.vth div{font-size:12px;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vth .new{color:var(--warn);font-weight:800}
/* 카드 뽑기 연출 */
.reveal{display:grid;place-items:center;padding:8px 0 4px;perspective:1000px}
.flip{width:min(72vw,300px);transform-style:preserve-3d;animation:flip 1s ease-out .2s both}
.flip .pcard{backface-visibility:hidden}
@keyframes flip{from{transform:rotateY(180deg) scale(.7);opacity:.2}to{transform:none}}
.rar-big{text-align:center;font-weight:800;font-size:18px;margin:12px 0 4px}
.rar-big.SR{color:#e0a100}.rar-big.R{color:#2f6fe0}.rar-big.sp{color:#e04fae}
/* 영상 */
.player{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.player.v{aspect-ratio:9/16;max-height:68vh;width:auto;margin:0 auto}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.shorts{position:fixed;inset:0;z-index:60;background:#000;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
.slide{height:100dvh;scroll-snap-align:start;position:relative;display:grid;place-items:center}
.slide .sv{position:relative;height:100%;max-height:100dvh;aspect-ratio:9/16;max-width:100vw;background:#111 center/cover no-repeat}
.slide .sv iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.slide .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 16px calc(env(safe-area-inset-bottom) + 18px);color:#fff;font-size:14px;background:linear-gradient(transparent,rgba(0,0,0,.7));pointer-events:none}
.shorts-x{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;z-index:61;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:18px}
.shorts-hint{position:fixed;top:calc(env(safe-area-inset-top) + 18px);left:16px;z-index:61;color:#fff;font-size:13px;opacity:.8}
/* 김결 탭 */
.prof-big{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--pri)}
.prof-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.prof-row:last-of-type{border-bottom:0}
.prof-row span:first-child{color:var(--sub)}
.prof-row b{text-align:right}
.diary{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.diary:last-child{border-bottom:0}
.diary img{flex:none;width:64px;height:64px;object-fit:cover;border-radius:10px}
.diary .memo{font-size:13px;color:var(--sub);margin-top:2px}
.acc-pick{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
.acc-pick button{width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--line);border:3px solid transparent}
.acc-pick button.on{border-color:var(--card);box-shadow:0 0 0 2px var(--c)}
.acc-pick input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;border-radius:50%}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

</nav>
<div id="sheet"></div>

<script>
(() => {
'use strict';
const KEY = 'gyeolsim-v1';
const APP_VERSION = 'v22'; // sw.js의 CACHE 숫자와 같이 올리기
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const WD = ['일','월','화','수','목','금','토'];
const fmtMD = s => { const d = parseD(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
const fmtShort = s => { const d = parseD(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const safeUrl = u => /^https?:\/\//i.test(String(u || '').trim());
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));

/* ---------- 저장 ---------- */
// 일정 카테고리: 'me'(기본)와 'fan'(가수 일정, D-day용)은 지울 수 없음
// 파랑·노랑·빨강·초록·보라·분홍·갈색·회색: 색상(hue)이나 밝기가 서로 확실히 다르게
const CAT_COLORS = ['#2f6fe0', '#e0a100', '#e03b3b', '#23a052', '#8e4fe0', '#e04fae', '#9a6a3a', '#6b7a8f'];
// 예전 팔레트 → 새 팔레트
const OLD_CAT_COLORS = { '#3d7ef5': '#2f6fe0', '#e09a00': '#e0a100', '#7c5cff': '#8e4fe0', '#2fa36b': '#23a052', '#e5484d': '#e03b3b', '#d6409f': '#e04fae', '#0fa3b1': '#6b7a8f', '#8a6f5a': '#9a6a3a' };
const hexOk = s => /^#[0-9a-f]{6}$/i.test(String(s || ''));
const defaultCats = () => [{ id: 'me', name: '내 일정', color: '#2f6fe0' }, { id: 'fan', name: '', color: '#e0a100' }];
function normCats(list) {
  const out = (Array.isArray(list) ? list : [])
    .filter(c => c && c.id && hexOk(c.color))
    .map(c => ({ id: String(c.id), name: String(c.name || '').slice(0, 12), color: OLD_CAT_COLORS[c.color.toLowerCase()] || c.color }));
  for (const c of defaultCats().reverse()) if (!out.some(x => x.id === c.id)) out.unshift(c);
  return out;
}
function defaults() {
  return {
    tasks: [], events: [], projects: [], cats: defaultCats(),
    settings: { name: '', singer: '김결', tone: 'balanced', songs: [], photo: null, alarmTimes: ['11:00', '14:00', '16:00', '20:00', '22:00'] },
    stats: { points: 0, streak: 0, lastGoalDate: null },
    ui: { installHidden: false, pushOn: false },
    fan: normFan(null)
  };
}
// 김결 탭 데이터: 포토카드(cards: 'id|장면' → 받은 날), 기념일 카드, 날마다 뽑은 보상, 숨긴 카드, 본 영상, 덕질 기록, 테마
function normFan(f) {
  const obj = o => o && typeof o === 'object' && !Array.isArray(o) ? o : {};
  const arr = a => Array.isArray(a) ? a : [];
  f = obj(f);
  return {
    profile: { since: '', birthday: '', debut: '', fandom: '', agency: '', fav: '', ...obj(f.profile) },
    cards: obj(f.cards), special: obj(f.special), days: obj(f.days),
    hidden: arr(f.hidden), seen: arr(f.seen).slice(-300), memories: arr(f.memories).slice(-200),
    diary: arr(f.diary).filter(x => x && x.id && isDate(x.date)),
    feed: arr(f.feed),
    theme: { accent: '', bg: '', ...obj(f.theme) }
  };
}
function normalize(d) {
  const b = defaults();
  return {
    tasks: Array.isArray(d.tasks) ? d.tasks.filter(t => t && t.id && t.title) : [],
    events: Array.isArray(d.events) ? d.events.filter(e => e && e.id && isDate(e.date)) : [],
    projects: Array.isArray(d.projects) ? d.projects.filter(p => p && p.id && p.title) : [],
    cats: normCats(d.cats),
    settings: (() => { // 예전 alarmHours(정시 숫자)를 alarmTimes('HH:MM')로 옮김
      const st = { ...b.settings, ...(d.settings || {}) };
      if (!Array.isArray((d.settings || {}).alarmTimes) && Array.isArray(st.alarmHours)) st.alarmTimes = st.alarmHours.filter(Number.isInteger).map(h => `${pad(h)}:00`);
      delete st.alarmHours;
      return st;
    })(),
    stats: { ...b.stats, ...(d.stats || {}) },
    ui: { ...b.ui, ...(d.ui || {}) },
    fan: (() => { // 예전 '응원 사진'은 배경 사진으로 이어서 씀
      const f = normFan(d.fan);
      if (!d.fan && String((d.settings || {}).photo || '').startsWith('data:image/')) f.theme.bg = 'upload';
      return f;
    })()
  };
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {}
  return defaults();
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('저장 공간이 부족해요. 응원 사진을 지우거나 바꿔 보세요.'); }
  queuePushSync();
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  },

const occurs = (ev, ds) => ev.yearly ? (ev.date.slice(5) === ds.slice(5) && ds >= ev.date) : ev.date === ds;
const eventsOn = ds => S.events.filter(e => occurs(e, ds)).sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
function nextOccurrence(ev, from) {
  if (!ev.yearly) return ev.date >= from ? ev.date : null;
  const y = +from.slice(0, 4); let c = `${y}${ev.date.slice(4)}`;
  if (c < from) c = `${y + 1}${ev.date.slice(4)}`;
  if (c < ev.date) c = ev.date;
  return c;
}
function nextEvent(fan) {
  const t = todayStr(); let best = null;
  for (const e of S.events) {
    if ((e.type === 'fan') !== fan) continue;
    const d = nextOccurrence(e, t);
    if (d && (!best || d < best.d)) best = { e, d };
  }
  return best;
}

const catById = id => S.cats.find(c => c.id === id) || S.cats.find(c => c.id === 'me');
const catName = c => c.id === 'fan' ? `⭐ ${singerName()}` : c.name;

/* ---------- 프로젝트 ---------- */
const PJ_COLORS = ['#7c5cff', '#3d7ef5', '#2fa36b', '#e09a00', '#e5484d', '#d6409f'];
const projById = id => S.projects.find(p => p.id === id);
const pjColor = p => PJ_COLORS.includes(p && p.color) ? p.color : PJ_COLORS[0];
const ST_LABEL = { done: '완료 🎉', late: '마감 지남', behind: '뒤처짐', ok: '순항 중', empty: '세부 할 일 없음' };
function projStats(p) {
  const subs = S.tasks.filter(t => t.projectId === p.id);
  const total = subs.length, done = subs.filter(t => t.done).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const t = todayStr();
  let timePct = null, dleft = null;
  if (isDate(p.end)) {
    dleft = daysBetween(t, p.end);
    if (isDate(p.start) && p.end > p.start) {
      const all = daysBetween(p.start, p.end), el = daysBetween(p.start, t);
      timePct = Math.min(100, Math.max(0, Math.round(el / all * 100)));
    }
  }
  let status;
  if (total && done === total) status = 'done';
  else if (!total) status = 'empty';
  else if (dleft !== null && dleft < 0) status = 'late';
  else if (timePct !== null && pct + 15 < timePct) status = 'behind';
  else status = 'ok';
  return { subs, total, done, pct, timePct, dleft, status };
}
const ddayTxt = n => n === null ? '' : n < 0 ? `${-n}일 지남` : n === 0 ? 'D-DAY' : `D-${n}`;
function projSort(a, b) {
  const sa = projStats(a), sb = projStats(b);
  if ((sa.status === 'done') !== (sb.status === 'done')) return sa.status === 'done' ? 1 : -1;
  return (a.end || '9999-12-31').localeCompare(b.end || '9999-12-31');
}
function projCard(p) {
  const s = projStats(p);
  return `<button class="card pj-card" style="--c:${pjColor(p)}" data-act="open-proj" data-id="${esc(p.id)}">
    <div class="pj-top"><div class="pj-title">${esc(p.title)}</div><span class="st ${s.status}">${ST_LABEL[s.status]}</span></div>
    <div class="pbar"><i style="width:${s.pct}%"></i></div>
    <div class="pj-row"><span><b>${s.pct}%</b> · 세부 ${s.done}/${s.total}</span><span>${s.timePct !== null ? `기간 ${s.timePct}% 경과 · ` : ''}${ddayTxt(s.dleft)}</span></div>
  </button>`;
}

/* ---------- 할 일 ---------- */
// 할 일 목록에 보일지: 프로젝트 세부 할 일은 마감 당일(또는 오늘 끝낸 것)만
const inTodo = x => !x.projectId || x.due === todayStr() || (x.done && x.doneAt === todayStr());
const todoTasks = () => S.tasks.filter(inTodo);
// 우선순위: 높음(high) · 보통(normal) · 낮음(low)
const PRI = { high: '높음', normal: '보통', low: '낮음' };
const priRank = t => t.priority === 'high' ? 0 : t.priority === 'low' ? 2 : 1;
const priPick = v => `<div class="pri-pick" role="radiogroup" aria-label="우선순위">${Object.keys(PRI).map(k => `<label><input type="radio" name="pri" value="${k}" ${k === (PRI[v] ? v : 'normal') ? 'checked' : ''}><span>${k === 'high' ? '★ ' : ''}${PRI[k]}</span></label>`).join('')}</div>`;
// 정렬: 설정의 '우선순위순'(기본)이면 우선순위 → 마감일, '마감일순'이면 마감일 → 우선순위. 같으면 등록 순
function taskSort(a, b) {
  const ad = a.due || '9999-12-31', bd = b.due || '9999-12-31';
  const byDue = ad === bd ? 0 : ad < bd ? -1 : 1, byPri = priRank(a) - priRank(b);
  return (S.ui.taskSort === 'due' ? byDue || byPri : byPri || byDue) || (a.createdAt || 0) - (b.createdAt || 0);
}
function dueBadge(t) {
  if (!t.due) return '';
  if (t.done) return `<span class="badge">${fmtShort(t.due)}</span>`;
  const n = daysBetween(todayStr(), t.due);
  if (t.carry) return `<span class="badge warn">${t.carry}일째 이월</span>`;
  if (n < 0) return `<span class="badge warn">${-n}일 지남</span>`;
  if (n === 0) return `<span class="badge hot">오늘</span>`;
  return `<span class="badge">D-${n}</span>`;
}
function taskItem(t, hideProj) {
  const p = !hideProj && t.projectId ? projById(t.projectId) : null;
  return `<li class="task ${t.done ? 'done' : ''}">
    <button class="chk" data-act="toggle" data-id="${esc(t.id)}" aria-label="${t.done ? '완료 취소' : '완료'}">${t.done ? '✓' : ''}</button>
    <div class="t-main"><div class="t-title" data-act="edit-task" data-id="${esc(t.id)}">${t.priority === 'high' ? '<span class="star">★</span>' : ''}${esc(t.title)}</div>
    <div class="t-meta">${p ? `<span class="badge pj" style="--c:${pjColor(p)}">📁 ${esc(p.title)}</span>` : ''}${t.priority === 'low' && !t.done ? '<span class="badge">낮음</span>' : ''}${dueBadge(t)}${t.detail ? '<span class="badge">📄 상세</span>' : ''}${t.note ? '<span class="badge">📝 메모</span>' : ''}</div></div>
    <button class="x" data-act="del-task" data-id="${esc(t.id)}" aria-label="삭제">✕</button></li>`;
}
function addTask(title, due, pri, projectId) {
  title = title.trim(); if (!title) return false;
  S.tasks.push({ id: uid(), title: title.slice(0, 100), due: isDate(due) ? due : null, priority: PRI[pri] ? pri : pri === true ? 'high' : 'normal', done: false, doneAt: null, createdAt: Date.now(), projectId: projectId && projById(projectId) ? projectId : null });
  save(); return true;
}
// 프로젝트의 마지막 세부 할 일을 끝냈는지 확인 (보너스는 프로젝트당 한 번)
function checkProjectDone(t) {
  const p = t.projectId && projById(t.projectId);
  if (!p || p.bonusGiven) return false;
  if (projStats(p).status !== 'done') return false;
  p.bonusGiven = true; S.stats.points += 50;
  return p;
}
function toggleTask(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  if (!t.done) {
    const before = doneToday(), wasMet = goalMet(before, goalN());
    let pts = 10;
    if (t.priority === 'high') pts += 5;
    if (t.due && t.due >= todayStr() && !t.carry) pts += 5;
    t.done = true; t.doneAt = todayStr(); t.pts = pts;
    S.stats.points += pts;
    const goalHit = !wasMet && goalMet(before + 1, goalN());
    if (goalHit) {
      const td = todayStr();
      if (S.stats.lastGoalDate !== td) {
        const y = new Date(); y.setDate(y.getDate() - 1);
        S.stats.streak = S.stats.lastGoalDate === ymd(y) ? S.stats.streak + 1 : 1;
        S.stats.lastGoalDate = td;
      }
    }
    const pDone = checkProjectDone(t);
    if (goalHit || pDone) {
      save(); render(); burst();
      toast(pDone ? line('projDone', { p: pDone.title, singer: singerName() }) : line('goalDone', coachState().v));
      return;
    }
    const p = t.projectId && projById(t.projectId);
    const extra = p ? ` · '${p.title}' ${projStats(p).pct}%` : '';
    toast(line('done', { pts }, Math.floor(Math.random() * 3)) + extra);
  } else {
    t.done = false; t.doneAt = null;
    S.stats.points = Math.max(0, S.stats.points - (t.pts || 0)); t.pts = 0;
  }
  save(); render();
}

/* ---------- 렌더 ---------- */
// 마감이 지난 안 끝난 할 일은 오늘로 넘기고, 넘어온 날수를 carry에 쌓음
// 프로젝트 세부 할 일은 넘기지 않고 프로젝트 안에 '지남'으로 남김
function rollover() {
  const t = todayStr(); let ch = false;
  for (const x of S.tasks) {
    if (x.projectId && x.carry) { // 예전 버전에서 넘겨 버린 세부 할 일은 원래 마감일로 되돌림
      const d = parseD(x.due); d.setDate(d.getDate() - x.carry); x.due = ymd(d); x.carry = 0; ch = true;
    }
    if (!x.projectId && !x.done && isDate(x.due) && x.due < t) { x.carry = (x.carry || 0) + daysBetween(x.due, t); x.due = t; ch = true; }
  }
  if (newTaskDue < t) newTaskDue = t;
  if (ch) save();
}

function render() {
  rollover();
  applyTheme();
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#nav-fan').textContent = singerName().slice(0, 6);
  const app = $('#app');
  if (openProject && !projById(openProject)) openProject = null;
  app.innerHTML = tab === 'home' ? renderHome() : tab === 'cal' ? renderCal() : tab === 'tasks' ? renderTasks()
    : tab === 'proj' ? (openProject ? renderProjectDetail(projById(openProject)) : renderProjects())
    : tab === 'fan' ? renderFan() : renderSettings();
}

function renderProjects() {
  const list = [...S.projects].sort(projSort);
  return `
  <div class="top"><h1>프로젝트</h1><button class="btn primary sm" data-act="new-proj">+ 새 프로젝트</button></div>
  ${list.length ? list.map(projCard).join('') : `<section class="card">
    <h2>한 달짜리 목표를 프로젝트로 만들어 보세요</h2>
    <p class="muted" style="margin:0 0 12px">예: '정처기 실기 합격', '포트폴리오 완성'처럼 기간이 긴 목표를 만들고 세부 할 일을 넣으면, 진행률(%)과 기간이 얼마나 지났는지 함께 보여 드려요. 진행이 기간보다 밀리면 코치가 알려 줘요.</p>
    <button class="btn primary" data-act="new-proj">첫 프로젝트 만들기</button></section>`}`;
}

function renderProjectDetail(p) {
  const s = projStats(p), c = pjColor(p);
  const subs = [...s.subs].sort((a, b) => (a.done - b.done) || taskSort(a, b));
  const period = [p.start ? fmtMD(p.start) : '', p.end ? fmtMD(p.end) : ''].filter(Boolean).join(' ~ ');
  const gapMsg = s.status === 'behind' ? `기간보다 ${s.timePct - s.pct}%p 밀려 있어요. 오늘 하나만 끝내도 따라잡을 수 있어요.`
    : s.status === 'late' ? '마감일이 지났어요. 남은 일을 정리하거나 마감일을 다시 잡아 보세요.'
    : s.status === 'done' ? '모든 세부 할 일을 끝냈어요. 수고했어요!'
    : s.status === 'empty' ? '아래에서 세부 할 일을 추가하면 진행률이 계산돼요.'
    : s.timePct !== null ? (s.pct >= s.timePct ? '기간보다 앞서 가고 있어요. 좋아요!' : '거의 계획대로 가고 있어요.') : '';

  <button class="back" data-act="close-proj">‹ 프로젝트 목록</button>
  <div class="top" style="margin-top:0"><div><div class="sub">${esc(period) || '기간 미정'}${s.dleft !== null ? ' · ' + ddayTxt(s.dleft) : ''}</div><h1>${esc(p.title)}</h1></div></div>
  <section class="card" style="--c:${c}">
    <div class="pj-top"><div class="pj-big"><b>${s.pct}%</b><span class="muted">세부 할 일 ${s.done}/${s.total} 완료</span></div><span class="st ${s.status}">${ST_LABEL[s.status]}</span></div>
    <div class="pbar"><i style="width:${s.pct}%"></i></div>
    ${s.timePct !== null ? `<div class="pj-row"><span>기간 경과</span><span><b>${s.timePct}%</b></span></div><div class="pbar thin time"><i style="width:${s.timePct}%"></i></div>` : ''}
    ${gapMsg ? `<p class="muted" style="margin:8px 0 0">${gapMsg}</p>` : ''}
  </section>
  ${p.memo ? `<section class="card"><h2>메모</h2><p class="memo">${esc(p.memo)}</p></section>` : ''}
  <section class="card">
    <h2>세부 할 일</h2>
    ${subs.length ? `<ul class="list">${subs.map(t => taskItem(t, true)).join('')}</ul>` : '<div class="empty-txt">아직 세부 할 일이 없어요.</div>'}
    <form data-form="sub-task" data-pid="${esc(p.id)}">
      <div class="add-row"><input type="text" name="text" placeholder="세부 할 일 추가" maxlength="100" autocomplete="off" enterkeyhint="done"><button class="btn primary">추가</button></div>
      <div class="add-opts"><div style="flex:1;min-width:0">${datePick('due', '', { min: todayStr(), max: p.end || '', none: true })}</div></div>
    </form>
  </section>
  <div class="btn-row"><button class="btn ghost" data-act="edit-proj" data-id="${esc(p.id)}">프로젝트 수정</button><button class="btn danger" data-act="del-proj" data-id="${esc(p.id)}">삭제</button></div>`;
}

// 할 일 수정: 이름·마감일·중요·상세 내용·완료 후 메모

// 이번 달과 기간이 겹치는 프로젝트 (기간 미정이면 아직 안 끝난 것만)
function monthProjects() {
  const t = todayStr(), ms = t.slice(0, 8) + '01', me = t.slice(0, 8) + '31';
  return S.projects.filter(p => {
    if (!p.start && !p.end) return projStats(p).status !== 'done';
    return (p.start || '0000-00-00') <= me && (p.end || '9999-12-31') >= ms;
  }).sort(projSort);
}

function renderHome() {
  const t = todayStr(), now = new Date();
  const d = doneToday(), goal = goalN();
  const pct = goal ? Math.min(100, Math.round(d / goal * 100)) : 0;
  const evs = eventsOn(t);
  const projs = monthProjects();
  const todays = S.tasks.filter(x => x.due === t && (!x.done || x.doneAt === t)).sort((a, b) => (a.done - b.done) || taskSort(a, b));
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const bg = bgHTML(), sd = sinceDays();
  const dateTxt = `${now.getMonth() + 1}월 ${now.getDate()}일 ${WD[now.getDay()]}요일${sd ? ` · ${esc(singerName())}${josa(singerName(), '과', '와')} 함께한 지 ${sd}일째` : ''}`;
  const title = `<h1>${S.settings.name ? esc(S.settings.name) + '의 ' : ''}결심</h1>`;

  return `
  ${bg ? `<div class="banner">${bg}<div class="ov"><div class="sub">${dateTxt}</div>${title}</div></div>`
    : `<div class="top"><div><div class="sub">${dateTxt}</div>${title}</div></div>`}
  ${!standalone && !S.ui.installHidden ? `<div class="install"><div>📲 Safari <b>공유 버튼</b> → <b>홈 화면에 추가</b>를 누르면 앱처럼 쓸 수 있어요.</div><button data-act="hide-install" aria-label="닫기">✕</button></div>` : ''}
  <button class="card stats" style="width:100%;text-align:left" data-act="tab" data-tab="tasks">
    <div class="ring" style="--p:${pct}"><span>${d}/${goal}</span></div>
    <div class="stat-txt"><div class="stat-big">${goal ? `오늘 목표 ${pct}%` : '오늘 마감인 할 일이 없어요'}</div>
      <div class="mini"><span>⭐ <b>${S.stats.points}</b>점</span><span>🔥 <b>${curStreak()}</b>일 연속</span></div></div>
  </button>
  ${rewardCard()}
  <section class="card">
    <div class="sec-head"><h2>오늘 할 일</h2><button class="btn ghost sm" data-act="new-task">+ 할 일</button></div>
    ${todays.length ? `<ul class="list">${todays.map(x => taskItem(x)).join('')}</ul>` : '<div class="empty-txt">오늘 할 일이 없어요.</div>'}
  </section>
  <section class="card">
    <div class="sec-head"><h2>${now.getMonth() + 1}월 목표</h2><button class="btn ghost sm" data-act="tab" data-tab="proj">전체</button></div>
    ${projs.length ? projs.map(p => {

// 왼쪽: 가수 일정, 오른쪽: 내 일정(가수 일정이 아닌 모든 카테고리)
function ddayHTML() {
  const half = (fan, label, emptyTxt) => {
    const nx = nextEvent(fan);

    if (!nx) return `<div class="card dday" style="--fan:${color}"><div class="dd-label">${label}</div><div class="muted" style="margin-top:4px">${emptyTxt}</div></div>`;
    const n = daysBetween(todayStr(), nx.d);
    return `<div class="card dday" style="--fan:${color}"><div class="dd-label">${label}</div>
      <div class="dd-num">${n === 0 ? 'D-DAY' : 'D-' + n}</div>

}

        : tile('draw-card', '🃏', '포토카드 뽑기', CARDS.length ? `${Object.keys(S.fan.cards).length}/${CARDS.length}장 모음` : '오늘 1장', '')}
      ${tile('new-videos', '📺', nv.length ? `새 영상 ${nv.length}개` : '최근 영상', nv.length ? '도착했어요' : '새 영상은 아직 없어요', nv[0] ? ytThumb(nv[0].id) : '')}

function evItem(e) {

function renderCal() {
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  const start = new Date(y, m, 1).getDay(), dim = new Date(y, m + 1, 0).getDate();
  const t = todayStr();
  let cells = WD.map((w, i) => `<div class="wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('');
  for (let i = 0; i < start; i++) cells += '<div></div>';
  for (let d = 1; d <= dim; d++) {
    const ds = `${y}-${pad(m + 1)}-${pad(d)}`;
    // 칸 안에 일정 제목을 2개까지, 나머지는 +N
    const items = [
      ...eventsOn(ds).map(e => ({ title: e.title, color: catById(e.type).color })),
      ...S.projects.filter(p => p.end === ds).map(p => ({ title: '📁 ' + p.title, color: pjColor(p) }))
    ];
    const dow = (start + d - 1) % 7;
    cells += `<button class="cell mcell ${ds === t ? 'today' : ''} ${ds === selDay ? 'sel' : ''} ${dow === 0 ? 'sun' : dow === 6 ? 'sat' : ''}" data-act="day" data-d="${ds}">
      <span class="num">${d}</span>${items.slice(0, 2).map(x => `<i class="ce" style="--c:${x.color}">${esc(x.title)}</i>`).join('')}${items.length > 2 ? `<i class="ce more">+${items.length - 2}</i>` : ''}</button>`;
  }
  const evs = eventsOn(selDay);
  const pjs = S.projects.filter(p => p.end === selDay);

  <div class="top"><h1>캘린더</h1></div>
  ${ddayHTML()}
  <section class="card">
    <div class="cal-head"><h2>${y}년 ${m + 1}월</h2>
      <div class="cal-nav"><button class="icon-btn" data-act="prev" aria-label="이전 달">‹</button><button class="icon-btn" data-act="cal-today" aria-label="오늘" style="font-size:12px;font-weight:700">오늘</button><button class="icon-btn" data-act="next" aria-label="다음 달">›</button></div></div>
    <div class="grid">${cells}</div>
  </section>
  <section class="card">
    <div class="sec-head"><h2>${fmtMD(selDay)}</h2><button class="btn ghost sm" data-act="add-event" data-d="${selDay}">+ 일정</button></div>
    ${evs.length ? `<ul class="list">${evs.map(evItem).join('')}</ul>` : '<div class="empty-txt">일정이 없어요.</div>'}
    ${pjs.length ? `<h2 style="margin-top:14px">프로젝트 마감</h2>${pjs.map(projCard).join('')}` : ''}
  </section>`;
}

/* ---------- 미니 달력 (할 일 마감일) ---------- */
/* ---------- 날짜·시간 선택 (모든 폼 공용) ---------- */
function dueLabel(ds) {
  if (!ds) return '📅 날짜 없음';
  const n = daysBetween(todayStr(), ds);
  return `📅 ${fmtMD(ds)}${n === 0 ? ' · 오늘' : n === 1 ? ' · 내일' : ''}`;
}
// 버튼을 누르면 아래에 미니 달력이 열림. 고른 값은 hidden input(name)에 들어감
// opts: min, max (YYYY-MM-DD), none (날짜 없음 허용)
function datePick(name, value, opts = {}) {
  return `<div class="dpf" data-min="${esc(opts.min || '')}" data-max="${esc(opts.max || '')}" data-none="${opts.none ? 1 : ''}">
    <input type="hidden" name="${name}" value="${esc(value || '')}">
    <button type="button" class="date-btn" data-act="dp-toggle" aria-expanded="false">${dueLabel(value)}</button>
    <div class="dp-box"></div></div>`;
}
const YEARS_PER_PAGE = 20;
// 연도 버튼 → 연도 목록, 월 버튼 → 월 목록에서 바로 고르기
function dpHTML(f) {
  const [y, m] = f.dataset.cur.split('-').map(Number);
  const val = f.querySelector('input').value, { min, max, none } = f.dataset, t = todayStr();
  const mode = f.dataset.mode || 'day';
  const nav = (lbl) => `<div class="cal-nav"><button type="button" class="icon-btn" data-act="dp-move" data-v="-1" aria-label="이전 ${lbl}">‹</button><button type="button" class="icon-btn" data-act="dp-move" data-v="1" aria-label="다음 ${lbl}">›</button></div>`;
  const ttl = `<div style="display:flex;gap:6px"><button type="button" class="dp-ttl ${mode === 'year' ? 'on' : ''}" data-act="dp-mode" data-v="year">${y}년 ▾</button><button type="button" class="dp-ttl ${mode === 'month' ? 'on' : ''}" data-act="dp-mode" data-v="month">${m}월 ▾</button></div>`;
  if (mode === 'year') {
    const base = Math.floor(y / YEARS_PER_PAGE) * YEARS_PER_PAGE, ny = +t.slice(0, 4);
    const ys = Array.from({ length: YEARS_PER_PAGE }, (_, i) => base + i);
    return `<div class="dp"><div class="cal-head">${ttl}${nav('연도들')}</div>
      <div class="dp-pick4">${ys.map(v => `<button type="button" class="dp-opt ${v === y ? 'sel' : v === ny ? 'now' : ''}" data-act="dp-y" data-v="${v}" ${(min && v < +min.slice(0, 4)) || (max && v > +max.slice(0, 4)) ? 'disabled' : ''}>${v}</button>`).join('')}</div></div>`;
  }
  if (mode === 'month') {
    return `<div class="dp"><div class="cal-head">${ttl}${nav('해')}</div>
      <div class="dp-pick4">${Array.from({ length: 12 }, (_, i) => i + 1).map(v => {
        const ym = `${y}-${pad(v)}`;
        return `<button type="button" class="dp-opt ${v === m ? 'sel' : ym === t.slice(0, 7) ? 'now' : ''}" data-act="dp-m" data-v="${v}" ${(min && ym < min.slice(0, 7)) || (max && ym > max.slice(0, 7)) ? 'disabled' : ''}>${v}월</button>`;
      }).join('')}</div></div>`;
  }
  const start = new Date(y, m - 1, 1).getDay(), dim = new Date(y, m, 0).getDate();
  let cells = WD.map((w, i) => `<div class="wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('');
  for (let i = 0; i < start; i++) cells += '<div></div>';
  for (let d = 1; d <= dim; d++) {
    const ds = `${y}-${pad(m)}-${pad(d)}`, dow = (start + d - 1) % 7;
    const off = (min && ds < min) || (max && ds > max);
    cells += `<button type="button" class="cell ${ds === t ? 'today' : ''} ${ds === val ? 'sel' : ''} ${dow === 0 ? 'sun' : dow === 6 ? 'sat' : ''}" data-act="dp-pick" data-d="${ds}" ${off ? 'disabled' : ''}><span class="num">${d}</span></button>`;
  }
  const todayOk = !(min && t < min) && !(max && t > max);
  return `<div class="dp">
    <div class="cal-head">${ttl}${nav('달')}</div>
    <div class="grid">${cells}</div>
    ${todayOk || none ? `<div class="btn-row" style="margin-top:8px">${todayOk ? `<button type="button" class="btn ghost sm" data-act="dp-pick" data-d="${t}">오늘</button>` : ''}${none ? '<button type="button" class="btn ghost sm" data-act="dp-pick" data-d="">날짜 없음</button>' : ''}</div>` : ''}
  </div>`;
}
// 입력 중인 다른 칸이 지워지지 않게 달력 부분만 다시 그림
function dpSet(f, open) {
  if (open) document.querySelectorAll('.dpf').forEach(o => { if (o !== f) dpSet(o, false); });
  f.querySelector('.dp-box').innerHTML = open ? dpHTML(f) : '';
  f.querySelector('.date-btn').innerHTML = dueLabel(f.querySelector('input').value);
  f.querySelector('.date-btn').setAttribute('aria-expanded', open);
}
// 시간: 시·분 드롭다운. 시를 '시간 없음'으로 두면 종일 일정
function timePick(value) {
  const [h, mi] = /^\d{2}:\d{2}$/.test(value || '') ? value.split(':') : ['', '00'];
  const hl = n => `${n < 12 ? '오전' : '오후'} ${n % 12 || 12}시`;
  return `<div class="tp">
    <select name="th" aria-label="시"><option value="">시간 없음 (종일)</option>${Array.from({ length: 24 }, (_, n) => `<option value="${pad(n)}" ${pad(n) === h ? 'selected' : ''}>${hl(n)}</option>`).join('')}</select>
    <select name="tm" aria-label="분">${Array.from({ length: 12 }, (_, n) => pad(n * 5)).map(v => `<option value="${v}" ${v === mi ? 'selected' : ''}>${v}분</option>`).join('')}</select></div>`;
}
const timeVal = el => el.th.value ? `${el.th.value}:${el.tm.value || '00'}` : '';

  return `
  <div class="top"><h1>할 일</h1></div>

let shortsObs = null;
function openShorts() {
  const seed = hash(todayStr());
  const rest = VIDEOS.filter(v => v.k === 'B' && !S.fan.feed.some(f => f.id === v.id))
    .map((v, i) => [hash(v.id) ^ seed, v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const list = [...S.fan.feed.filter(v => v.k === 'B'), ...rest].slice(0, 60);
  if (!list.length) { toast('숏츠 목록을 불러오지 못했어요.'); return; }
  const el = document.createElement('div'); el.className = 'shorts'; el.id = 'shorts';
  el.innerHTML = list.map(v => `<div class="slide" data-id="${esc(v.id)}"><div class="sv" style="background-image:url('${ytThumb(v.id, 'oardefault')}')"></div><div class="cap">${esc(v.t)}</div></div>`).join('');
  document.body.append(el);
  const x = document.createElement('button'); x.className = 'shorts-x'; x.dataset.act = 'shorts-close'; x.textContent = '✕'; x.setAttribute('aria-label', '닫기');
  const hint = document.createElement('div'); hint.className = 'shorts-hint'; hint.textContent = '위로 넘겨서 다음 영상';
  document.body.append(x, hint); setTimeout(() => hint.remove(), 2500);
  document.body.style.overflow = 'hidden';
  shortsObs = new IntersectionObserver(es => es.forEach(e => {
    const sv = e.target.querySelector('.sv');
    if (e.isIntersecting) {
      if (!sv.querySelector('iframe')) sv.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(e.target.dataset.id)}?playsinline=1&rel=0&autoplay=1&loop=1" allow="autoplay; encrypted-media" title="숏츠"></iframe>`;
      if (!S.fan.seen.includes(e.target.dataset.id)) { S.fan.seen.push(e.target.dataset.id); save(); }
    } else sv.innerHTML = '';
  }), { root: el, threshold: 0.6 });
  el.querySelectorAll('.slide').forEach(s => shortsObs.observe(s));
}
function closeShorts() {
  if (shortsObs) shortsObs.disconnect(); shortsObs = null;
  document.querySelectorAll('#shorts,.shorts-x,.shorts-hint').forEach(e => e.remove());
  document.body.style.overflow = '';
  render();
}

// 사진을 줄여서 dataURL로 (폰 저장 공간 아끼기)
function shrinkImage(file, max, q, done) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      done(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => toast('이 사진은 불러올 수 없어요.');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

    <form data-form="cat" data-id="${c ? esc(c.id) : ''}">
      <h3>${isNew ? '새 카테고리' : '카테고리 수정'}</h3>
      ${c && c.id === 'fan' ? `<p class="muted" style="margin:0 0 12px">⭐ ${esc(singerName())} 일정은 이름이 가수 이름으로 정해져 있어요. 색상만 바꿀 수 있어요.</p>`
        : `<label class="f">이름<input type="text" name="text" required maxlength="12" value="${c ? esc(c.name) : ''}" placeholder="예: 학교, 알바, 운동" autocomplete="off"></label>`}
      <div class="f muted" style="font-weight:600;font-size:13px">색상</div>
      <div class="color-pick" style="flex-wrap:wrap">${CAT_COLORS.map(cl => `<label><input type="radio" name="color" value="${cl}" ${cl === color ? 'checked' : ''}><span style="--c:${cl}"></span></label>`).join('')}</div>
      <div class="sheet-btns"><button type="button" class="btn ghost" data-act="close">취소</button><button class="btn primary">${isNew ? '만들기' : '저장'}</button></div>
    </form></div></div>`;
  if (isNew) setTimeout(() => { const i = $('#sheet input[name=text]'); if (i) i.focus(); }, 50);
}
const closeSheet = () => { $('#sheet').innerHTML = ''; };

let toastTimer;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2600);
}
function burst() {
  const emo = ['💜', '🎵', '⭐', '🎉', '✨', '🎧'];
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('span'); s.className = 'burst'; s.textContent = emo[i % emo.length];
    s.style.left = (5 + Math.random() * 90) + 'vw';
    s.style.animationDelay = (Math.random() * .35) + 's';
    s.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 2100);
  }
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'close-bg' && e.target !== el) return;
  switch (a) {
    case 'tab': tab = el.dataset.tab; nudge = 0; openProject = null; newTaskDue = todayStr(); render(); window.scrollTo(0, 0); break;
    case 'open-proj': tab = 'proj'; openProject = el.dataset.id; render(); window.scrollTo(0, 0); break;
    case 'close-proj': openProject = null; render(); window.scrollTo(0, 0); break;
    case 'new-proj': openProjectSheet(null); break;
    case 'new-task': openTaskSheet(); break;
    case 'push-on': enablePush(); break;
    case 'push-off': disablePush(); break;
    case 'alarm-add': {
      const t = `${$('#alarm-h').value}:${$('#alarm-m').value}`, ts = alarmTimes();
      if (ts.includes(t)) { toast('이미 있는 시간이에요.'); break; }
      S.settings.alarmTimes = [...ts, t].sort(); save(); render(); toast(`${timeLabel(t)} 알림을 추가했어요.`); break;
    }
    case 'alarm-del': S.settings.alarmTimes = alarmTimes().filter(x => x !== el.dataset.v); save(); render(); break;
    case 'edit-proj': openProjectSheet(projById(el.dataset.id)); break;
    case 'del-proj': {
      const p = projById(el.dataset.id); if (!p) break;
      const n = S.tasks.filter(t => t.projectId === p.id).length;
      if (confirm(`'${p.title}' 프로젝트를 지울까요?${n ? `\n세부 할 일 ${n}개도 함께 지워져요.` : ''}`)) {
        S.tasks = S.tasks.filter(t => t.projectId !== p.id);
        S.projects = S.projects.filter(x => x.id !== p.id);
        openProject = null; save(); render(); toast('프로젝트를 지웠어요.');
      }
      break;
    }
    case 'edit-task': {
      const t = S.tasks.find(x => x.id === el.dataset.id); if (t) openTaskEdit(t);
      break;
    }
    case 'toggle': toggleTask(el.dataset.id); break;
    case 'del-task': {
      const t = S.tasks.find(x => x.id === el.dataset.id);
      if (t && confirm(`'${t.title}' 할 일을 지울까요?`)) {
        if (t.done) S.stats.points = Math.max(0, S.stats.points - (t.pts || 0));
        S.tasks = S.tasks.filter(x => x.id !== t.id); save(); render();
      }
      break;
    }
    case 'clear-done':
      if (confirm('완료한 할 일을 모두 지울까요? (점수는 그대로 유지돼요)')) { S.tasks = S.tasks.filter(x => !x.done); save(); render(); }
      break;
    case 'del-event': {
      const ev = S.events.find(x => x.id === el.dataset.id);
      if (ev && confirm(`'${ev.title}' 일정을 지울까요?${ev.yearly ? '\n(매년 반복되는 일정 전체가 지워져요)' : ''}`)) { S.events = S.events.filter(x => x.id !== ev.id); save(); render(); }
      break;
    }
    case 'day': selDay = el.dataset.d; render(); break;
    case 'prev': calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() - 1, 1); render(); break;
    case 'next': calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 1); render(); break;
    case 'cal-today': { const d = new Date(); calCursor = new Date(d.getFullYear(), d.getMonth(), 1); selDay = todayStr(); render(); break; }
    case 'add-event': openEventSheet(el.dataset.d || selDay); break;
    case 'close': case 'close-bg': closeSheet(); break;
    case 'nudge': nudge++; render(); break;
    case 'reward-locked': {
      const left = goalN() - doneToday();
      toast(goalN() ? `할 일 ${left}개 더 끝내면 열려요! 🔒` : '오늘 마감인 할 일을 정하고 끝내면 열려요.'); break;
    }
    case 'draw-card': {
      if (!rewardOpen()) break;
      if (!CARDS.length) { toast('포토카드를 불러오는 중이에요. 잠시 뒤 다시 눌러 주세요.'); loadFanData(); break; }
      const k = drawCard(); if (!k) break;
      render(); openReveal(k); if (S.fan.cards[k] === todayStr()) burst(); break;
    }
    case 'draw-memory': {
      if (!rewardOpen()) break;
      if (!VIDEOS.length) { toast('영상 목록을 불러오는 중이에요. 잠시 뒤 다시 눌러 주세요.'); loadFanData(); break; }
      const id = drawMemory(); render(); if (id) openPlayer(id); break;
    }
    case 'new-videos': refreshFeed(); openVideoList(); break;
    case 'shorts': openShorts(); break;
    case 'shorts-close': closeShorts(); break;
    case 'play': openPlayer(el.dataset.id); break;
    case 'view-card': openCardView(el.dataset.k); break;
    case 'set-bg': S.fan.theme.bg = el.dataset.k; save(); closeSheet(); render(); toast('배경 사진으로 정했어요.'); break;
    case 'hide-card': {
      if (!confirm('이 카드를 바인더에서 숨길까요? 앞으로 뽑기에도 나오지 않아요.\n(바인더 아래에서 되돌릴 수 있어요)')) break;
      S.fan.hidden.push(el.dataset.k);
      if (S.fan.theme.bg === el.dataset.k) S.fan.theme.bg = '';
      save(); closeSheet(); render(); toast('카드를 숨겼어요.'); break;
    }
    case 'unhide': S.fan.hidden = []; save(); render(); toast('숨긴 카드를 되돌렸어요.'); break;
    case 'binder': binderFilter = el.dataset.f; render(); break;
    case 'edit-profile': openProfileSheet(); break;
    case 'new-diary': openDiarySheet(); break;
    case 'del-diary': {
      const x = S.fan.diary.find(d => d.id === el.dataset.id);
      if (x && confirm(`'${x.title}' 기록을 지울까요?`)) { S.fan.diary = S.fan.diary.filter(d => d.id !== x.id); save(); render(); }
      break;
    }
    case 'accent': S.fan.theme.accent = el.dataset.v === ACCENTS[0] ? '' : el.dataset.v; save(); render(); break;
    case 'hide-install': S.ui.installHidden = true; save(); render(); break;
    case 'task-sort': S.ui.taskSort = el.dataset.v === 'due' ? 'due' : 'pri'; save(); render(); break;
    case 'filter': taskFilter = el.dataset.f; render(); break;
    case 'dp-toggle': {
      const f = el.closest('.dpf'), open = !f.querySelector('.dp');
      if (open) { f.dataset.cur = (f.querySelector('input').value || todayStr()).slice(0, 7); f.dataset.mode = 'day'; }
      dpSet(f, open); break;
    }
    case 'dp-move': {
      const f = el.closest('.dpf'), [y, m] = f.dataset.cur.split('-').map(Number), mode = f.dataset.mode || 'day';
      const step = mode === 'year' ? 12 * YEARS_PER_PAGE : mode === 'month' ? 12 : 1;
      const d = new Date(y, m - 1 + Number(el.dataset.v) * step, 1);
      f.dataset.cur = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; dpSet(f, true); break;
    }
    case 'dp-mode': { const f = el.closest('.dpf'); f.dataset.mode = f.dataset.mode === el.dataset.v ? 'day' : el.dataset.v; dpSet(f, true); break; }
    case 'dp-y': case 'dp-m': {
      const f = el.closest('.dpf'), [y, m] = f.dataset.cur.split('-');
      f.dataset.cur = a === 'dp-y' ? `${el.dataset.v}-${m}` : `${y}-${pad(el.dataset.v)}`;
      f.dataset.mode = 'day'; dpSet(f, true); break;
    }
    case 'dp-pick': {
      const f = el.closest('.dpf'); f.querySelector('input').value = el.dataset.d;
      if (f.closest('[data-form=add-task]')) newTaskDue = el.dataset.d;
      dpSet(f, false); break;
    }
    case 'tone': S.settings.tone = el.dataset.v; save(); render(); toast(`${TONE[el.dataset.v].face} ${TONE[el.dataset.v].name}가 맡을게요!`); break;
    case 'new-cat': openCatSheet(null); break;
    case 'edit-cat': { const c = S.cats.find(x => x.id === el.dataset.id); if (c) openCatSheet(c); break; }
    case 'del-cat': {
      const c = S.cats.find(x => x.id === el.dataset.id); if (!c || c.id === 'me' || c.id === 'fan') break;
      const evs = S.events.filter(e => e.type === c.id);
      if (confirm(`'${c.name}' 카테고리를 지울까요?${evs.length ? `\n이 카테고리 일정 ${evs.length}개는 '내 일정'으로 바뀌어요.` : ''}`)) {
        evs.forEach(e => { e.type = 'me'; });
        S.cats = S.cats.filter(x => x.id !== c.id); save(); render();
      }
      break;
    }
    case 'manage-cats': closeSheet(); tab = 'set'; openProject = null; render(); { const s = $('#cats'); if (s) s.scrollIntoView(); } break;
    case 'del-photo': if (confirm('배경 사진을 없앨까요?')) { S.fan.theme.bg = ''; S.settings.photo = null; save(); render(); } break;
    case 'export': exportData(); break;
    case 'reset':
      if (confirm('모든 할 일, 일정, 설정을 지울까요? 되돌릴 수 없어요.') && confirm('정말 초기화할까요?')) { S = defaults(); save(); tab = 'home'; render(); toast('초기화했어요.'); }
      break;
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, k = f.dataset.form, el = f.elements;
  if (k === 'sub-task') {
    if (addTask(el.text.value, el.due.value, false, f.dataset.pid)) {
      render(); toast('세부 할 일을 추가했어요.');
      const i = document.querySelector('[data-form=sub-task] input[name=text]'); if (i) i.focus();
    }
  } else if (k === 'project') {
    const title = el.text.value.trim(); if (!title) { toast('프로젝트 이름을 입력해 주세요.'); return; }
    let start = isDate(el.start.value) ? el.start.value : null, end = isDate(el.end.value) ? el.end.value : null;
    if (start && end && end < start) { toast('마감일이 시작일보다 빨라요.'); return; }
    const color = PJ_COLORS.includes(el.color.value) ? el.color.value : PJ_COLORS[0];
    const memo = el.memo.value.trim().slice(0, 1000);
    let p = f.dataset.id && projById(f.dataset.id);
    if (p) { Object.assign(p, { title: title.slice(0, 40), start, end, color, memo }); }
    else {
      p = { id: uid(), title: title.slice(0, 40), start, end, color, memo, createdAt: Date.now(), bonusGiven: false };
      S.projects.push(p);
      (el.subs ? el.subs.value : '').split('\n').map(s => s.trim()).filter(Boolean).slice(0, 50)
        .forEach(s => addTask(s, null, false, p.id));
    }
    save(); closeSheet(); tab = 'proj'; openProject = p.id; render(); window.scrollTo(0, 0);
    toast(f.dataset.id ? '프로젝트를 수정했어요.' : '프로젝트를 만들었어요. 하나씩 끝내 보자!');
  } else if (k === 'task-edit') {
    const t = S.tasks.find(x => x.id === f.dataset.id); if (!t) { closeSheet(); return; }
    const title = el.text.value.trim(); if (!title) { toast('할 일을 입력해 주세요.'); return; }
    const due = isDate(el.due.value) ? el.due.value : null;
    if (due !== t.due) delete t.carry; // 날짜를 직접 다시 잡으면 이월 표시는 지움
    Object.assign(t, { title: title.slice(0, 100), due, priority: PRI[el.pri.value] ? el.pri.value : 'normal',
      detail: el.detail.value.trim().slice(0, 2000), note: el.note.value.trim().slice(0, 2000) });
    save(); closeSheet(); render(); toast('할 일을 수정했어요.');
  } else if (k === 'add-task') {
    if (!el.text.value.trim()) { toast('할 일을 입력해 주세요.'); return; }
    if (addTask(el.text.value, el.due.value, el.pri.value, el.pid ? el.pid.value : null)) { closeSheet(); render(); toast('할 일을 추가했어요.'); }
  } else if (k === 'cat') {
    const color = hexOk(el.color.value) ? el.color.value : CAT_COLORS[0];
    const c = f.dataset.id && S.cats.find(x => x.id === f.dataset.id);
    const name = el.text ? el.text.value.trim().slice(0, 12) : '';
    if (el.text && !name) { toast('카테고리 이름을 입력해 주세요.'); return; }
    if (c) { c.color = color; if (el.text) c.name = name; }
    else S.cats.push({ id: uid(), name, color });
    save(); closeSheet(); render(); toast(c ? '카테고리를 수정했어요.' : '카테고리를 만들었어요.');
  } else if (k === 'profile') {
    const d = n => isDate(el[n].value) ? el[n].value : '';
    Object.assign(S.fan.profile, { since: d('since'), birthday: d('birthday'), debut: d('debut'),
      fandom: el.fandom.value.trim().slice(0, 20), agency: el.agency.value.trim().slice(0, 30), fav: el.fav.value.trim().slice(0, 40) });
    save(); closeSheet(); render(); toast('프로필을 저장했어요.');
  } else if (k === 'diary') {
    const title = el.text.value.trim(), date = el.date.value;
    if (!title || !isDate(date)) { toast('제목과 날짜를 입력해 주세요.'); return; }
    S.fan.diary.push({ id: uid(), date, title: title.slice(0, 60), kind: DIARY_KINDS.some(([x]) => x === el.kind.value) ? el.kind.value : 'etc',
      place: el.place.value.trim().slice(0, 60), memo: el.memo.value.trim().slice(0, 1000), photo: diaryPhoto });
    diaryPhoto = null; save(); closeSheet(); render(); toast('덕질 기록을 남겼어요 💜');
  } else if (k === 'event') {
    const title = el.text.value.trim(), date = el.date.value;
    if (!title || !isDate(date)) { toast('제목과 날짜를 입력해 주세요.'); return; }
    S.events.push({ id: uid(), title: title.slice(0, 60), date, time: timeVal(el), place: el.place.value.trim().slice(0, 60), type: catById(el.type.value).id, yearly: el.yearly.checked });
    save(); closeSheet(); selDay = date; render(); toast('일정을 추가했어요.');
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.set) { S.settings[el.dataset.set] = el.value.trim(); save(); return; }
  if (el.dataset.file === 'photo' && el.files[0]) { setPhoto(el.files[0]); return; }
  if (el.dataset.file === 'diary-photo' && el.files[0]) {
    shrinkImage(el.files[0], 720, 0.7, url => { diaryPhoto = url; const b = $('#diary-photo-btn'); if (b) b.firstChild.textContent = '📷 사진 넣음 ✓ (바꾸기)'; });
    return;
  }
  if (el.matches('[data-accent]') && hexOk(el.value)) { S.fan.theme.accent = el.value; save(); render(); return; }
  if (el.dataset.file === 'import' && el.files[0]) { importData(el.files[0]); el.value = ''; }
});

function setPhoto(file) {
  shrinkImage(file, 900, 0.82, url => { S.settings.photo = url; S.fan.theme.bg = 'upload'; save(); render(); toast('배경 사진을 바꿨어요.'); });
}
function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `gyeolsim-backup-${todayStr()}.json`; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = normalize(JSON.parse(reader.result));
      if (!confirm(`백업을 불러올까요? 지금 기록은 백업 내용으로 바뀌어요.\n(할 일 ${d.tasks.length}개, 일정 ${d.events.length}개)`)) return;
      S = d; save(); render(); toast('백업을 불러왔어요.');
    } catch (err) { toast('백업 파일을 읽을 수 없어요.'); }
  };
  reader.readAsText(file);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  render(); queuePushSync(); refreshFeed();
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}); // 새 버전 확인
});

// 코치 말 주기적으로 바꾸기 (말풍선 글자만 바꿔서 입력 중인 내용은 그대로 둠)
let renderedDay = todayStr();
setInterval(() => {
  if (document.hidden) return;
  const busy = $('#sheet').innerHTML || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
  if (todayStr() !== renderedDay && !busy) { renderedDay = todayStr(); render(); return; } // 자정이 지나면 이월 처리
  if (tab !== 'tasks') return;
  const p = $('.bubble p'); if (!p) return;
  coachTick++;
  const msg = coachMsg();
  if (msg === p.textContent) return;
  p.textContent = msg;
  p.classList.remove('swap'); void p.offsetWidth; p.classList.add('swap');
}, 20000);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  // 새 서비스 워커가 자리 잡으면 한 번 새로고침해서 새 버전을 바로 보여 줌 (첫 설치 때는 제외)
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {}));
}

render();
queuePushSync();
loadFanData();
})();
</script>
